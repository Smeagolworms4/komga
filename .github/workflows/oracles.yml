name: KomgaJS oracles

# Oracle tests for KomgaJS (https://github.com/Smeagolworms4/komga-js), the TypeScript port of Komga:
# komga/src/test/kotlin/org/gotson/komga/oracle/ call the real Komga functions and record their results as JSON
# fixtures. KomgaJS commits these fixtures (test/unit/fixtures/) and replays every case on the ported functions.
# This workflow runs only the oracle tests and checks that the fixtures they produce are identical to the ones
# committed on the KomgaJS branch (default: unit-tests).

on:
  push:
    branches: [unit-oracles]
  workflow_dispatch:
    inputs:
      komga_js_ref:
        description: KomgaJS branch or commit holding the fixtures
        type: string
        default: unit-tests

jobs:
  oracles:
    name: Oracle fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          java-package: 'jdk'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Time zone, locale and temp dir of the test JVM are set by komga/build.gradle.kts when oracleOut is given
      - name: Oracle tests
        run: >
          ./gradlew :komga:test --tests 'org.gotson.komga.oracle.*'
          -PoracleOut="$RUNNER_TEMP/fixtures"
          -x runKtlintCheckOverMainSourceSet -x runKtlintCheckOverTestSourceSet

      - name: Upload fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-fixtures
          path: ${{ runner.temp }}/fixtures/

      - name: Checkout KomgaJS fixtures
        uses: actions/checkout@v7
        with:
          repository: Smeagolworms4/komga-js
          ref: ${{ inputs.komga_js_ref || 'unit-tests' }}
          path: komga-js
          sparse-checkout: test/unit/fixtures

      - name: Fixtures identical to KomgaJS
        run: |
          if diff -r komga-js/test/unit/fixtures "$RUNNER_TEMP/fixtures" > fixtures.diff; then
            echo "Fixtures identical: $(find "$RUNNER_TEMP/fixtures" -name '*.json' | wc -l) files" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            { echo '### Fixtures differ from KomgaJS'; echo '```diff'; head -c 60000 fixtures.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            head -200 fixtures.diff
            exit 1
          fi
